<!doctype html><meta charset="utf-8" /><title>Release browser regression</title
><style>
  body{background:#202124;color:#eee;font:15px Arial;padding:25px}main{max-width:1000px;margin:auto}h1{font-size:25px}pre{color:#b9e2bc;white-space:pre-wrap}iframe{width:100%;height:420px;border:1px solid #555;border-radius:12px;background:#202124}</style
><main
  ><h1>Open in Nuvio 1.7.1 · browser regression</h1
  ><p>Shipped scripts, local fixtures, simulated accounts. No private account writes.</p
  ><pre id="results">Running…</pre
  ><iframe title="Current regression fixture"></iframe></main
><script>
  (async()=>{const cases=['adaptive-browser.html','content-settings-browser.html','imdb-hydration-browser.html','performance-browser.html','settings-browser-tests.html','google-real-couture-browser.html','google-real-shark-browser.html'];const frame=document.querySelector('iframe'),results=document.getElementById('results'),lines=[];for(const file of cases){await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject;frame.src='/validation/'+file+'?release=1.7.1'});let title;for(let i=0;i<80;i++){title=frame.contentDocument.title;if(/^(?:PASS|\d+ PASS|FAIL)/.test(title))break;await new Promise(r=>setTimeout(r,100))}const pass=/^(?:PASS|\d+ PASS)/.test(title);lines.push((pass?'PASS ':'FAIL ')+file+' · '+title);results.textContent=lines.join('\n');if(!pass){document.title='FAIL release tests';return}}frame.style.display='none';document.title='7 PASS · release browser regression';})();
</script>
