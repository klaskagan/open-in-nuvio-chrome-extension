<!doctype html><meta charset="utf-8"><title>Adaptive buttons</title><style>body{background:#202124;color:white;font:16px Arial;padding:45px}main{max-width:850px;margin:auto}#container{width:700px;max-width:100%;background:#292b30;border-radius:16px;padding:16px;box-sizing:border-box;margin:25px 0}button{background:#443050;color:#eee;border:1px solid #a075b8;border-radius:8px;padding:10px 15px;cursor:pointer;margin-right:8px}#results{color:#b7e1bd;white-space:pre-wrap}</style><main><h1>Automatic button appearance</h1><p>Buttons respond to their container width. The browser viewport stays unchanged.</p><button id="narrow">Narrow container</button><button id="wide">Wide container</button><div id="container"><div id="host"></div></div><p id="results">Testing…</p><p>Local fixture · shipped appearance logic · no network or account writes.</p></main><script>window.chrome={storage:{local:{get:async()=>({nuvioSettings:{appearance:'auto'}})},onChanged:{addListener:()=>{}}}};</script><script src="/open-in-nuvio/settings.js?v=1.7.0"></script><script src="/open-in-nuvio/button-icon.js?v=1.7.0"></script><script>
(async()=>{const host=document.getElementById('host'),root=host.attachShadow({mode:'open'});root.innerHTML=`<style>.row{display:flex;gap:8px}a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid #9564ad;border-radius:24px;color:#e3b7fa;font:600 14px Arial;background:#241a2e;text-decoration:none}img{width:20px;height:20px;object-fit:contain}</style><div class="row"><a class="nuvio" aria-label="Open in Nuvio" title="Open in Nuvio Desktop" href="nuvio://imdb/movie/tt0253474"><img src="${NuvioButtonIcon}"><span>Open in Nuvio</span></a><a class="trakt" aria-label="Open in Trakt" title="Open in Trakt" href="https://trakt.tv/movies/tt0253474"><img src="${TraktButtonIcon}"><span>Open in Trakt</span></a></div>`;await NuvioSettings.ready;NuvioSettings.apply('google',host,root);const container=document.getElementById('container');document.getElementById('narrow').onclick=()=>container.style.width='240px';document.getElementById('wide').onclick=()=>container.style.width='700px';const wait=()=>new Promise(r=>setTimeout(r,150));await wait();const wide=host.dataset.nuvioAppearance==='labels';container.style.width='240px';await wait();const narrow=host.dataset.nuvioAppearance==='compact';container.style.width='700px';await wait();const restored=host.dataset.nuvioAppearance==='labels';container.style.width='240px';await wait();document.getElementById('results').textContent=wide&&narrow&&restored?'PASS · wide = labels\nPASS · narrow = compact\nPASS · widening restores labels\nPASS · viewport unchanged':'FAIL adaptive appearance';document.title=wide&&narrow&&restored?'PASS adaptive':'FAIL adaptive';})();
</script>
