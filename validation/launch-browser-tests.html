<!doctype html>
<html lang="en"
  ><head
    ><meta charset="utf-8" /><meta
      name="viewport"
      content="width=device-width,initial-scale=1" /><title>Open in Nuvio</title
    ><link rel="stylesheet" href="/open-in-nuvio/launch.css" /></head
  ><body
    ><main
      ><div class="brand"><img id="icon" alt="" /><span>NUVIO LINK OPENER</span></div
      ><h1>Open in Nuvio</h1
      ><p id="status" role="status" aria-live="polite">Resolving the exact title…</p
      ><a id="launch" class="primary" hidden>Open in Nuvio</a
      ><a id="source" target="_blank" rel="noopener noreferrer" hidden
        >View original title</a
      ><button id="retry" hidden>Retry lookup</button
      ><p class="note"
        >Chrome may ask you to confirm opening Nuvio. If it does not open automatically,
        use the button above. You can close this tab afterward.</p
      ></main
    ><script>
      history.replaceState({},'',location.pathname+'#'+new URLSearchParams({source:'https://www.imdb.com/title/tt0117705/',kind:'movie'}));
      let launchAttempts=0;document.addEventListener('click',e=>{if(e.target.id==='launch'){e.preventDefault();launchAttempts++;}},true);
      window.chrome={storage:{local:{get:async()=>({}),set:async()=>{}}},runtime:{sendMessage:async()=>({url:'nuvio://imdb/movie/tt0117705',kind:'movie',identity:'tt0117705'})}};</script
    ><script src="/open-in-nuvio/settings.js"></script
    ><script src="/open-in-nuvio/button-icon.js"></script
    ><script src="/open-in-nuvio/google-core.js"></script
    ><script src="/open-in-nuvio/link-core.js"></script
    ><script src="/open-in-nuvio/launch.js"></script
    ><script>
      (async()=>{const wait=()=>new Promise(r=>setTimeout(r,80));const result=document.createElement('div');result.style.cssText='margin-top:22px;font:12px/1.7 monospace;color:#9fdfbe';document.querySelector('main').append(result);let n=0;const check=(v,m)=>{if(!v)throw new Error(m);n++;const line=document.createElement('div');line.textContent='PASS '+m;result.append(line)};try{await wait();const a=document.getElementById('launch');check(!a.hidden&&a.href==='nuvio://imdb/movie/tt0117705','Exact title launch link visible');check(launchAttempts===1,'Automatic handoff attempted once');check(document.getElementById('icon').complete&&document.getElementById('icon').naturalWidth>0,'Bundled Nuvio icon loaded');check(document.getElementById('source').href==='https://www.imdb.com/title/tt0117705/','Original title remains available');
      chrome.runtime.sendMessage=async()=>({error:'Lookup timed out'});document.getElementById('retry').click();await wait();check(!document.getElementById('retry').hidden&&a.hidden,'Failed lookup shows retry without a stale launch link');check(document.getElementById('status').textContent==='Lookup timed out','Lookup error rendered as text');
      chrome.runtime.sendMessage=async()=>({url:'https://evil.com',kind:'movie',identity:'wrong'});document.getElementById('retry').click();await wait();check(a.hidden&&launchAttempts===1,'Foreign scheme cannot launch');
      chrome.runtime.sendMessage=async()=>({url:'nuvio://imdb/movie/tt0117705',kind:'movie',identity:'tt0117705'});document.getElementById('retry').click();await wait();check(!a.hidden&&launchAttempts===2,'Retry restores exact launch link');await NuvioSettings.save({...NuvioSettings.get(),autoLaunch:false});document.getElementById('retry').click();await wait();check(!a.hidden&&launchAttempts===2,'Manual handoff preference prevents automatic launch');a.click();check(launchAttempts===3,'Manual launch remains available');await NuvioSettings.save({...NuvioSettings.get(),enabled:false});document.getElementById('retry').click();await wait();check(a.hidden&&launchAttempts===3,'Paused extension cannot launch');document.title=n+' PASS — launcher fixture';const note=document.createElement('p');note.className='note';note.textContent='Local browser fixture: runtime replies and external-app navigation are simulated.';result.after(note);
      }catch(e){result.textContent+='FAIL '+e.message;document.title='FAIL — launcher fixture'}})();
    </script></body
  ></html
>
