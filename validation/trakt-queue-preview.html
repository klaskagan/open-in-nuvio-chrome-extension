<!doctype html><meta charset="utf-8" /><title>Trakt controls browser fixture</title
><style>
  body{background:#202124;color:#e8eaed;font:16px Arial;padding:40px}.card{max-width:560px;margin:auto;padding:26px;border:1px solid #555;border-radius:20px}.controls{display:flex;justify-content:space-around;align-items:start;margin:32px 0}button.native{color:#ddd;background:none;border:0;font:16px Arial}.circle{display:block;border:1px solid #888;border-radius:50%;padding:14px;margin-bottom:8px}#results{font:12px/1.6 monospace;color:#a9d9b4}small{color:#aaa}</style
><main class="card"
  ><h2>Žiūrėti filmą</h2><p>Space Jam · 1996</p
  ><div class="controls" data-attrid="kc:/film/film:media_actions_wholepage"
    ><div><span class="circle">▶</span>Žiūrėti dabar</div
    ><button class="native" type="button"
      ><span class="circle">✓</span><span>Žiūrėta</span
      ><span style="display:none">Žiūrėta</span></button
    ><button class="native" type="button"
      ><span class="circle">▯</span><span>Noriu žiūrėti</span></button
    ></div
  ><p
    ><small
      >Local fixture using shipped controls. Simulated delayed response: both quick clicks
      are already selected before either save finishes.</small
    ></p
  ></main
><script>
  let watched=false,watchlist=false,nativeClicks=0,messages=[],allowed=true,openCount=0,valid=true;const roots=[];const original=Element.prototype.attachShadow;Element.prototype.attachShadow=function(o){const s=original.call(this,o);roots.push(s);return s};document.querySelectorAll('button.native').forEach(b=>b.onclick=()=>nativeClicks++);window.open=()=>{openCount++};window.chrome={runtime:{getURL:f=>'chrome-extension://fixture/'+f,sendMessage:async m=>{messages.push(m);if(m.type.endsWith('update'))return new Promise(()=>{});if(m.type.endsWith('manage'))openCount++;if(m.type.endsWith('update')){if(m.action==='watchlist')watchlist=m.desired;if(m.action==='watched')watched=m.desired;}return {title:'Space Jam',watched,watchlist,plays:watched?1:0}}}};window.NuvioSettings={get:()=>({enabled:true,sites:{google:true},traktControls:allowed})};</script
><script src="/open-in-nuvio/google-trakt.js"></script
><script>
  NuvioGoogleTrakt.sync({id:'tt0117705',kind:'movie',target:document.querySelector('[data-attrid]'),key:'preview',valid:()=>true}).then(()=>{roots[0].querySelector('button').onclick();roots[1].querySelector('button').onclick();});
</script>
