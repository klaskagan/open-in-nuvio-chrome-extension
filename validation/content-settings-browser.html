<!doctype html><meta charset="utf-8" /><title>Trusted settings integration</title
><style>
  body{background:#202124;color:#eee;font:16px Arial;padding:40px}#results{color:#b8e2bd;white-space:pre-wrap}button{background:#443050;color:#eee;border:1px solid #a075b8;border-radius:8px;padding:10px}</style
><h1>Content settings boundary</h1
><p
  >Local fixture. Chrome messages are simulated; the shipped content scripts run below.</p
><div data-attrid="title">Gia</div><div data-attrid="subtitle">1998</div
><div data-attrid="kc:/film/film:media_actions_wholepage"></div
><a href="https://www.imdb.com/title/tt0123865/"><h3>Gia (TV Movie 1998)</h3></a
><pre id="results">Running…</pre
><script>
  history.replaceState({},'','/search?q=gia');const listeners=[];let reads=0,direct=0;window.chrome={runtime:{id:'fixture',onMessage:{addListener:f=>listeners.push(f)},sendMessage:async m=>{if(m.type==='nuvio:settings-read'){reads++;return {settings:{appearance:'compact',traktControls:false}}}throw Error('Unexpected message '+m.type)}},storage:{local:{get:async()=>{direct++;throw Error('Content scripts cannot access trusted storage')}}}};</script
><script src="/open-in-nuvio/content-settings.js"></script
><script src="/open-in-nuvio/settings.js"></script
><script src="/open-in-nuvio/button-icon.js"></script
><script src="/open-in-nuvio/google-core.js"></script
><script src="/open-in-nuvio/google.js"></script
><script>
  setTimeout(async()=>{let n=0,lines=[];const check=(v,m)=>{if(!v)throw Error(m);lines.push('PASS '+m);n++};const send=settings=>listeners.forEach(f=>f({type:'nuvio:settings-changed',settings},{id:'fixture'}));const wait=()=>new Promise(r=>setTimeout(r,120));try{check(reads===1&&direct===0,'Preferences load through one message, zero direct storage reads');check(document.querySelector('[data-nuvio-google]')?.dataset.nuvioAppearance==='compact','Shipped Google buttons use returned settings');send({enabled:false});await wait();check(!document.querySelector('[data-nuvio-google]'),'Live pause removes controls');send({enabled:true,appearance:'labels'});await wait();check(document.querySelector('[data-nuvio-google]')?.dataset.nuvioAppearance==='labels','Live resume restores labels');document.title=n+' PASS · trusted settings';}catch(e){lines.push('FAIL '+e.message);document.title='FAIL trusted settings'}document.getElementById('results').textContent=lines.join('\n');},200);
</script>
